name: project-guardrails

on:
  pull_request:
  push:
    branches:
      - main
      - project-guardrails
  workflow_dispatch:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.lock.txt
            requirements-dev.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt -r requirements-dev.lock.txt

      - name: Run project guardrails
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/preflight_gate.py --ci --base-ref "origin/${{ github.base_ref }}"
          else
            python scripts/preflight_gate.py --ci --base-ref origin/main
          fi

name: industrial-planner-checked-artifacts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/industrial_planner_checked_artifacts.yml'
      - 'CHANGELOG.md'
      - 'FILE_STATUS.md'
      - 'PROJECT_LOCK.md'
      - 'docs/industrial_planner_recipe_capacity_audit.md'
      - 'data/examples/industrial_planner/README.md'
      - 'data/examples/industrial_planner/full_demand_base_support_matrix.json'
      - 'data/examples/industrial_planner/full_demand_base_support_matrix.md'
      - 'data/examples/industrial_planner/full_demand_deployment_path_matrix.json'
      - 'data/examples/industrial_planner/full_demand_deployment_path_matrix.md'
      - 'data/examples/industrial_planner/full_demand_recipe_capacity_canonical_blueprint.json'
      - 'data/examples/industrial_planner/full_demand_support_overview.json'
      - 'data/examples/industrial_planner/full_demand_support_overview.md'
      - 'data/examples/industrial_planner/full_demand_support_suite_inventory.json'
      - 'data/examples/industrial_planner/checked_artifact_family_inventory.json'
      - 'data/preprocessed/generic_io_requirements.json'
      - 'rules/canonical_rules.json'
      - 'requirements.txt'
      - 'requirements.lock.txt'
      - 'scripts/industrial_planner_scope.py'
      - 'scripts/audit_industrial_planner_checked_artifact_suite.py'
      - 'scripts/audit_industrial_planner_full_demand_base_matrix.py'
      - 'scripts/audit_industrial_planner_full_demand_deployment_matrix.py'
      - 'scripts/audit_industrial_planner_full_demand_support_suite.py'
      - 'scripts/audit_industrial_planner_full_demand_support_suite_inventory.py'
      - 'scripts/build_industrial_planner_full_demand_fixture.py'
      - 'scripts/export_industrial_planner_bundle.py'
      - 'src/adapters/industrial_planner/**'
      - 'src/io/delivery_manifest.py'
      - 'src/render/blueprint_exporter.py'
      - 'src/tests/test_industrial_planner_checked_artifact_suite.py'
      - 'src/tests/test_industrial_planner_export.py'
      - 'src/tests/test_industrial_planner_full_demand_base_matrix.py'
      - 'src/tests/test_industrial_planner_full_demand_deployment_matrix.py'
      - 'src/tests/test_industrial_planner_full_demand_support_suite.py'
      - 'src/tests/test_industrial_planner_full_demand_support_suite_inventory.py'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/industrial_planner_checked_artifacts.yml'
      - 'CHANGELOG.md'
      - 'FILE_STATUS.md'
      - 'PROJECT_LOCK.md'
      - 'docs/industrial_planner_recipe_capacity_audit.md'
      - 'data/examples/industrial_planner/README.md'
      - 'data/examples/industrial_planner/full_demand_base_support_matrix.json'
      - 'data/examples/industrial_planner/full_demand_base_support_matrix.md'
      - 'data/examples/industrial_planner/full_demand_deployment_path_matrix.json'
      - 'data/examples/industrial_planner/full_demand_deployment_path_matrix.md'
      - 'data/examples/industrial_planner/full_demand_recipe_capacity_canonical_blueprint.json'
      - 'data/examples/industrial_planner/full_demand_support_overview.json'
      - 'data/examples/industrial_planner/full_demand_support_overview.md'
      - 'data/examples/industrial_planner/full_demand_support_suite_inventory.json'
      - 'data/examples/industrial_planner/checked_artifact_family_inventory.json'
      - 'data/preprocessed/generic_io_requirements.json'
      - 'rules/canonical_rules.json'
      - 'requirements.txt'
      - 'requirements.lock.txt'
      - 'scripts/industrial_planner_scope.py'
      - 'scripts/audit_industrial_planner_checked_artifact_suite.py'
      - 'scripts/audit_industrial_planner_full_demand_base_matrix.py'
      - 'scripts/audit_industrial_planner_full_demand_deployment_matrix.py'
      - 'scripts/audit_industrial_planner_full_demand_support_suite.py'
      - 'scripts/audit_industrial_planner_full_demand_support_suite_inventory.py'
      - 'scripts/build_industrial_planner_full_demand_fixture.py'
      - 'scripts/export_industrial_planner_bundle.py'
      - 'src/adapters/industrial_planner/**'
      - 'src/io/delivery_manifest.py'
      - 'src/render/blueprint_exporter.py'
      - 'src/tests/test_industrial_planner_checked_artifact_suite.py'
      - 'src/tests/test_industrial_planner_export.py'
      - 'src/tests/test_industrial_planner_full_demand_base_matrix.py'
      - 'src/tests/test_industrial_planner_full_demand_deployment_matrix.py'
      - 'src/tests/test_industrial_planner_full_demand_support_suite.py'
      - 'src/tests/test_industrial_planner_full_demand_support_suite_inventory.py'

jobs:
  checked-artifact-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt

      - name: Compile Python surfaces
        run: python -m compileall -q scripts src

      - name: Run focused IndustrialPlanner regressions
        run: |
          python -m pytest \
            src/tests/test_industrial_planner_export.py \
            src/tests/test_industrial_planner_full_demand_base_matrix.py \
            src/tests/test_industrial_planner_full_demand_deployment_matrix.py \
            src/tests/test_industrial_planner_full_demand_support_suite.py \
            src/tests/test_industrial_planner_full_demand_support_suite_inventory.py \
            src/tests/test_industrial_planner_checked_artifact_suite.py

      - name: Run checked-artifact gate
        run: |
          mkdir -p .artifacts/industrial_planner_checked_artifacts
          python scripts/audit_industrial_planner_checked_artifact_suite.py \
            --family-inventory data/examples/industrial_planner/checked_artifact_family_inventory.json \
            --json-output .artifacts/industrial_planner_checked_artifacts/checked_artifact_suite_summary.json \
            --markdown-output .artifacts/industrial_planner_checked_artifacts/checked_artifact_suite_summary.md \
            --console-output .artifacts/industrial_planner_checked_artifacts/checked_artifact_suite_summary.txt

      - name: Publish Markdown summary
        if: always()
        run: |
          if [ -f .artifacts/industrial_planner_checked_artifacts/checked_artifact_suite_summary.md ]; then
            cat .artifacts/industrial_planner_checked_artifacts/checked_artifact_suite_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload checked-artifact summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: industrial-planner-checked-artifacts
          path: .artifacts/industrial_planner_checked_artifacts/
          if-no-files-found: warn

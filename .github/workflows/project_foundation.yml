name: project-foundation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - project-foundation

jobs:
  project-foundation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.lock.txt
            requirements-dev.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt -r requirements-dev.lock.txt

      - name: Compile repo-native gates
        run: python -m py_compile scripts/preflight_gate.py scripts/sync_doc_subjects.py scripts/check_doc_tree_completeness.py

      - name: Run project foundation gate
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="origin/main"
          fi
          python scripts/preflight_gate.py --ci --base-ref "$BASE_REF"

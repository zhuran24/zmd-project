name: project-foundation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - project-foundation

# Least-privilege: these gates only read the repo (checkout); they never push commits, comment, or
# mutate the repo. upload-artifact / pip cache use the Actions runtime token, not contents scope.
permissions:
  contents: read

# Cancel a superseded in-progress run when a newer commit lands on the same ref (saves CI minutes;
# the latest pushed state is always what gets the full gate).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-foundation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.lock.txt
            requirements-dev.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt -r requirements-dev.lock.txt

      - name: Compile repo-native gates
        run: python -m py_compile scripts/preflight_gate.py

      - name: Run project foundation gate
        env:
          # 2 核 runner 对本机(24 核)的子检查超时放大: checker 本机 11s、快 lane
          # pytest(-n auto) 本机 ~70s, 仓库长大后 30s/240s 上限在 runner 上双超时
          # (2026-07-11 两连红实测), slow job 与本机门禁同批全绿。
          PREFLIGHT_TIMEOUT_SCALE: "6"
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="origin/main"
          fi
          python scripts/preflight_gate.py --ci --base-ref "$BASE_REF"

  slow-soundness-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.lock.txt
            requirements-dev.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt -r requirements-dev.lock.txt

      - name: Compile repo-native gates
        run: python -m py_compile scripts/preflight_gate.py

      - name: Restore required external artifacts
        run: |
          python src/placement/placement_generator.py
          python scripts/check_external_artifacts.py --require candidate_placements

      - name: Run slow soundness gate
        run: python scripts/preflight_gate.py --slow-tests
